# Configuração definitiva, ativada depois da emissão do certificado TLS.
server {
    listen 80;
    server_name sigafeira.online www.sigafeira.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sigafeira.online www.sigafeira.online;

    ssl_certificate     /etc/letsencrypt/live/sigafeira.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigafeira.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $upstream_siga siga-acessibilidade;
        proxy_pass http://$upstream_siga:80$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
